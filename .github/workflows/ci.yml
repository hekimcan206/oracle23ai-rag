name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test:
    name: build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # Package versions are pinned and updated by hand, so a known vulnerability in any direct or
      # transitive package fails the build. Fix it with a pinned upgrade in Directory.Packages.props.
      - name: Audit for vulnerable packages
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
            echo "::error::Known-vulnerable NuGet packages found (see the list above)"
            exit 1
          fi

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release

      - name: Unit, property, golden and API tests
        run: >
          dotnet test --no-build --configuration Release
          --project tests/OracleRag.UnitTests
          --coverage --coverage-output-format cobertura
          --results-directory "${{ github.workspace }}/TestResults"

      - name: Coverage summary
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.12
        with:
          reports: TestResults/**/*.cobertura.xml
          targetdir: coverage
          reporttypes: MarkdownSummaryGithub
          assemblyfilters: "-*Tests*;-*Benchmarks*"
          filefilters: "-*/obj/*"

      - name: Publish coverage to job summary
        if: always()
        run: |
          if [ -f coverage/SummaryGithub.md ]; then
            cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage report produced."
          fi

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-test-results
          path: TestResults/
          retention-days: 7

  integration:
    name: integration (Oracle 26ai Free + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Testcontainers starts gvenzl/oracle-free:23-slim-faststart and pgvector/pgvector:0.8.1-pg17 on the runner's
      # Docker engine; one shared contract suite runs against both.
      - name: Integration tests
        run: >
          dotnet test --configuration Release
          --project tests/OracleRag.IntegrationTests
          --results-directory "${{ github.workspace }}/TestResults"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-test-results
          path: TestResults/
          retention-days: 7

  container:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: oracle23ai-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image runs as non-root
        run: |
          user=$(docker image inspect oracle23ai-rag:ci --format '{{.Config.User}}')
          echo "Configured user: ${user}"
          test -n "${user}" && test "${user}" != "0" && test "${user}" != "root"

  compose-demo:
    name: docker compose demo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # The README promises `docker compose up` runs the whole demo with zero manual steps; this job keeps it true.
      - name: Start the stack
        run: docker compose up -d --build

      - name: Seed finishes
        run: |
          test "$(docker wait oracle23ai-rag-seed-1)" = "0" || { docker compose logs seed; exit 1; }
          docker compose logs seed

      - name: API becomes ready on both stores
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:18424/health/ready && break
            sleep 2
          done
          curl -fsS http://localhost:18424/health/ready
          curl -fsS http://localhost:18424/v1/stores | tee stores.json
          grep -q '"oracle"' stores.json && grep -q '"postgres"' stores.json

      - name: Both stores give the same cited answer, and both abstain on an uncovered topic
        run: |
          for store in oracle postgres; do
            curl -fsS -X POST "http://localhost:18424/v1/stores/${store}/ask" -H 'content-type: application/json' \
              --data-binary @samples/ask-answerable.json | tee "answer-${store}.json"; echo
            grep -q '"abstained":false' "answer-${store}.json"
            grep -q '"chunkId":"isikalan-hospital-parking#0000"' "answer-${store}.json"
            grep -q '59 TL per hour' "answer-${store}.json"
            curl -fsS -X POST "http://localhost:18424/v1/stores/${store}/ask" -H 'content-type: application/json' \
              --data-binary @samples/ask-unanswerable.json | tee "abstain-${store}.json"; echo
            grep -q '"abstained":true' "abstain-${store}.json"
          done

      - name: The document comes back from the Oracle duality view with an ETag, and a stale ETag is refused
        run: |
          curl -fsS -D headers.txt http://localhost:18424/v1/stores/oracle/documents/isikalan-hospital-parking | tee doc.json; echo
          grep -q '"_metadata":{"etag":' doc.json
          grep -qi '^etag:' headers.txt
          status=$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://localhost:18424/v1/stores/oracle/documents/isikalan-hospital-parking \
            -H 'content-type: application/json' -H 'If-Match: "0000"' --data '{"title":"x","markdown":"## A\nB."}')
          echo "stale If-Match -> ${status}"
          test "${status}" = "412"

      - name: Logs on failure
        if: failure()
        run: docker compose logs
